# ARCHITECTURE.md §12's "build multi-arch Docker images -> scan -> push to
# GHCR -> deploy job (compose pull+up via SSH or watchtower)" stage, split
# out from ci.yml per docs/PROJECT_STRUCTURE.md's three-file convention.
# Runs only after CI has gone green on main (`workflow_run`), so a build
# never ships code that failed lint/tests.
#
# NOT exercised end-to-end — no GitHub remote and no deploy host exist for
# this repo in the sandbox this was written in. Same honesty ceiling as
# every other infra file in this project: correct to the best of each
# tool's own docs, unverified against a real run. Requires, before first
# use: a `production` GitHub environment with required reviewers (the
# manual approval gate ARCHITECTURE.md implies for publishing to a real
# server), and secrets DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY.
name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  build-images:
    name: Build + scan + push images
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: api
            dockerfile: backend/Dockerfile
            context: .
          - image: renderer
            dockerfile: backend/Dockerfile.renderer
            context: .
          - image: web
            dockerfile: frontend/Dockerfile
            context: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (load for scanning, don't push yet)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.event.workflow_run.head_sha }}
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.event.workflow_run.head_sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Build + push multi-arch
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:${{ github.event.workflow_run.head_sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.image }}:latest

  deploy:
    name: Deploy (compose pull + up via SSH)
    needs: build-images
    runs-on: ubuntu-latest
    # `environment: production` is what gives this its manual-approval
    # gate, IF the repo has that environment configured with required
    # reviewers — this workflow only supplies the job, not the repo
    # setting.
    environment: production
    steps:
      - name: Pull + restart via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/ytforge
            docker compose -f deploy/compose/docker-compose.yml --profile core pull
            docker compose -f deploy/compose/docker-compose.yml --profile core up -d
