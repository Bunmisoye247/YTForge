# ARCHITECTURE.md §12's "build multi-arch Docker images -> scan -> push to
# GHCR -> deploy job (compose pull+up via SSH or watchtower)" stage, split
# out from ci.yml per docs/PROJECT_STRUCTURE.md's three-file convention.
# Runs only after CI has gone green on main (`workflow_run`), so a build
# never ships code that failed lint/tests.
#
# NOT exercised end-to-end — no GitHub remote and no deploy host exist for
# this repo in the sandbox this was written in. Same honesty ceiling as
# every other infra file in this project: correct to the best of each
# tool's own docs, unverified against a real run. Requires, before first
# use: a `production` GitHub environment with required reviewers (the
# manual approval gate ARCHITECTURE.md implies for publishing to a real
# server), and secrets DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY.
name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  build-images:
    name: Build + scan + push images
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: api
            dockerfile: backend/Dockerfile
            context: .
            build-args: ""
          - image: renderer
            dockerfile: backend/Dockerfile.renderer
            context: .
            build-args: ""
          - image: web
            dockerfile: frontend/Dockerfile
            context: .
            # Next.js inlines NEXT_PUBLIC_* into the client bundle at build
            # time, so this has to be baked in here — a runtime env var on
            # the host can't change it after the fact. vars (not secrets)
            # because it's a public URL, literally meant to ship to the
            # browser. Set the `NEXT_PUBLIC_API_BASE_URL` repository
            # variable (Settings -> Secrets and variables -> Actions ->
            # Variables) to your real API origin; rebuild after changing it.
            build-args: |
              NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Compute lowercase image repo (GHCR requires lowercase)
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (load for scanning, don't push yet)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          platforms: linux/amd64
          load: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.image }}:${{ github.event.workflow_run.head_sha }}
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.image }}:${{ github.event.workflow_run.head_sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: Build + push multi-arch
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.image }}:${{ github.event.workflow_run.head_sha }}
            ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.image }}:latest

  deploy:
    name: Deploy (compose pull + up via SSH)
    needs: build-images
    runs-on: ubuntu-latest
    # `environment: production` is what gives this its manual-approval
    # gate, IF the repo has that environment configured with required
    # reviewers — this workflow only supplies the job, not the repo
    # setting.
    environment: production
    steps:
      - name: Pull + restart via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/ytforge
            # --env-file is required explicitly: compose's automatic .env
            # discovery defaults to the directory of the *compose file*
            # (deploy/compose/), not the invocation cwd, so ${VAR}
            # interpolation in the compose file (POSTGRES_PASSWORD, etc.)
            # silently fell back to blank without this.
            docker compose -f deploy/compose/docker-compose.yml --env-file .env --profile core pull
            docker compose -f deploy/compose/docker-compose.yml --env-file .env --profile core up -d
