app:
  debug: false
  # Deployed by IP, no domain/TLS yet (deferred) — the frontend origin the
  # browser actually sends is http://<host>:3000, not localhost, so it
  # needs to be in the allow-list or every browser-originated API call
  # (not curl, which isn't CORS-enforced) gets rejected at the preflight.
  # Update this if/when a real domain + Caddy TLS termination replaces
  # plain IP access.
  cors_origins:
    - http://169.58.94.97:3000

database:
  echo: false
  pool_size: 20

minio:
  # MinIO's own port is published on the same host per docker-compose.yml
  # (9000:9000) — presigned URLs need this public address, not the
  # docker-network-internal `minio:9000` every other MinIO call uses.
  # Update alongside cors_origins if/when a real domain replaces IP access.
  public_endpoint: 169.58.94.97:9000
