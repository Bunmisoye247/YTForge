# Phase 10: real metrics now flow (api/worker/renderer's OTel SDK export
# via otel-collector), plus Temporal server's own queue-depth metrics and
# the 4 alert rules named in ARCHITECTURE.md §9.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # The collector's own self-observability metrics (uptime, spans/metrics
  # received & exported, queue sizes) — enabled by default at :8888 by the
  # otelcol-contrib image, not configured explicitly in
  # otel-collector-config.yaml. Feeds the Infra dashboard's collector
  # health panel.
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: temporal
    static_configs:
      - targets: ["temporal:9091"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
